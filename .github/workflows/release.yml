name: release
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    # Enable once PyPI trusted publishing is configured: set repo variable PYPI_TRUSTED=true
    if: vars.PYPI_TRUSTED == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing, no API token needed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
