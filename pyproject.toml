[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kvleak"
dynamic = ["version"]
description = "Cut Claude Code token cost: find where your prompt-cache money leaks and fix it with one command. Also Codex CLI, Gemini CLI, OpenCode, any JSONL."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "kvleak contributors" }]
keywords = [
  "claude-code", "claude", "anthropic", "token-usage", "token-cost", "tokens", "cost", "cost-optimization",
  "prompt-caching", "kv-cache", "context-window", "context-engineering", "codex-cli", "gemini-cli", "opencode",
  "llm", "ai-agents", "multi-agent", "observability",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
kvleak = "kvleak.cli:main"

[project.urls]
Homepage = "https://github.com/shangliy/kvleak"
Issues = "https://github.com/shangliy/kvleak/issues"

[tool.hatch.version]
path = "src/kvleak/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["docs/launch", "docs/assets", "bench", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/kvleak"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
