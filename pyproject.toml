[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "kvleak"
dynamic = ["version"]
description = "Find where your AI coding agent leaks prompt-cache money (Claude Code, multi-agent, any JSONL) and how to stop it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "kvleak contributors" }]
keywords = ["claude-code", "prompt-caching", "kv-cache", "llm", "tokens", "cost", "multi-agent", "observability"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
kvleak = "kvleak.cli:main"

[project.urls]
Homepage = "https://github.com/kvleak/kvleak"
Issues = "https://github.com/kvleak/kvleak/issues"

[tool.hatch.version]
path = "src/kvleak/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kvleak"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
